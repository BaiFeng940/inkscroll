<style>
  :root{
    --bg:#c3d7e5; --paper:#ffffff; --surface:#f2f5f7; --line:rgb(20 20 20 / .12);
    --ink:#141414; --muted:#4a5068; --accent:#0f5257; --accent-soft:#e3edee;
    --font:"Instrument Sans", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono:"DM Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    --side-w:272px; --head-h:60px; --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{scroll-padding-top:calc(var(--head-h) + 24px)}
  body{
    background:var(--bg); color:var(--ink);

  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

  .brand{display:flex; align-items:center; gap:10px; font-weight:500; font-size:17px; letter-spacing:-.01em; color:var(--ink)}

  header .right{margin-left:auto; display:flex; align-items:center; gap:18px; font-size:14px; color:var(--muted)}

  /* ── 左侧目录 ── */

    overflow-y:auto; padding:20px 0 64px; border-right:1px solid var(--line);
    background:color-mix(in srgb, var(--bg) 82%, #fff);

    display:block; padding:8px 24px 8px 24px; font-size:14px; line-height:1.5; color:var(--ink);

  }
  nav a:hover{text-decoration:none; background:var(--accent-soft)}
  nav a.active{color:var(--accent); border-left-color:var(--accent); font-weight:500; background:var(--accent-soft)}

  /* ── 正文 ── */
  main{margin-left:var(--side-w); padding:calc(var(--head-h) + 44px) 40px 120px}
  article{max-width:760px}
  article h1{font-size:34px; line-height:1.25; letter-spacing:-.02em; font-weight:500; margin:0 0 8px}
  article .meta{font-size:13px; color:var(--muted); margin:0 0 40px}
  article h2{font-size:22px; line-height:1.4; font-weight:500; letter-spacing:-.01em; margin:56px 0 12px}
  article h3{font-size:17px; line-height:1.5; font-weight:500; margin:32px 0 6px}
  article p{margin:14px 0; max-width:66ch}
  article ul, article ol{padding-left:22px; margin:14px 0}
  article li{margin:8px 0}
  article li > ul, article li > ol{margin:8px 0}

  article code{
    font:400 13.5px/1.5 var(--mono); background:var(--surface); border-radius:5px; padding:2px 6px;
    box-shadow:inset 0 0 0 1px rgb(20 20 20 / .06);

  article pre{
    margin:18px 0; padding:16px 18px; background:var(--surface); border-radius:var(--r);
    overflow:auto; box-shadow:inset 0 0 0 1px rgb(20 20 20 / .06);
  }
  article pre code{background:none; box-shadow:none; padding:0; font:400 13px/1.75 var(--mono); white-space:pre}
  article table{border-collapse:collapse; width:100%; margin:20px 0; font-size:15px; line-height:1.65}
  article th{
    text-align:left; font-weight:500; font-size:13px; color:var(--muted);
    padding:0 14px 8px 0; border-bottom:1px solid var(--line);
  }
  article td{padding:12px 14px 12px 0; border-bottom:1px solid var(--line); vertical-align:top}
  article tr:last-child td{border-bottom:0}
  article table code{white-space:nowrap}

  /* 提示块：不用彩色大盒子，只用一条 2px 边和一个标签 */
  article .note, article .warn, article .ok{
    margin:22px 0; padding:16px 20px; border-left:2px solid var(--accent);
    background:var(--surface); border-radius:0 var(--r) var(--r) 0;

  article .note > b, article .warn > b, article .ok > b{
    display:block; font-size:13px; font-weight:500; letter-spacing:.04em; color:var(--accent); margin-bottom:4px;

  article .ok{border-left-color:#2c6b46}
  article .ok > b{color:#2c6b46}

  article figure{margin:24px 0; padding:0}
  article figure img{
    display:block; width:100%; max-width:320px; border-radius:var(--r);
    box-shadow:0 0 0 1px var(--line), 0 18px 40px -30px rgb(12 18 26 / .55);
  }
  article figcaption{margin-top:10px; font-size:13px; line-height:1.6; color:var(--muted); max-width:320px}

  article footer{
    margin-top:72px; padding-top:20px; border-top:1px solid var(--line);
    font-size:13px; line-height:1.8; color:var(--muted); max-width:66ch;
  }
  article footer a{color:var(--muted); text-decoration:underline; text-underline-offset:2px}

  /* 上一篇 / 下一篇 */
  .pager{display:flex; gap:16px; margin-top:48px; flex-wrap:wrap}
  .pager a{
    flex:1 1 220px; display:grid; gap:2px; padding:14px 16px; border-radius:var(--r);
    background:var(--surface); color:var(--ink); text-decoration:none;
  }
  .pager a:hover{background:var(--accent-soft); text-decoration:none}
  .pager span{font-size:12px; color:var(--muted)}
  .pager b{font-weight:500; font-size:14px}

  @media (max-width:960px){
    #menuBtn{display:inline-flex}
    nav{
      transform:translateX(-100%); transition:transform .22s ease; width:min(86vw, 320px);
      box-shadow:0 24px 60px -30px rgb(12 18 26 / .5); z-index:25;
      background:var(--bg);

    body.open nav{transform:none}
    body.open::after{content:""; position:fixed; inset:0; background:rgb(12 18 26 / .32); z-index:20}
    main{margin-left:0; padding:calc(var(--head-h) + 28px) 22px 96px}
    article h1{font-size:28px}
    article h2{font-size:20px; margin-top:44px}
    header .right a:not(:first-child){display:none}
  }
</style>

const ARTICLES = [];

A('从这里开始','intro','inkScroll 是什么',
`
<p>inkScroll 是 Android 上的本地与网盘漫画阅读器，用 Flutter 写，MIT 许可。它只做一件事：把你已经有的漫画文件，按页读出来。</p>

<h2>它做什么</h2>
<table>
  <tr><th>能力</th><th>说明</th></tr>
  <tr><td>本地导入</td><td>压缩包（zip / cbz / tar）、文件夹、散图</td></tr>
  <tr><td>网盘在线看</td><td>WebDAV 直连 NAS 或网盘，不下载整本</td></tr>
  <tr><td>压缩包在线读</td><td>网盘上的 zip 也按页读，翻到哪页取哪页</td></tr>
  <tr><td>两种翻页</td><td>左右翻页 / 上下滑动（长条图一条长页）</td></tr>
  <tr><td>高刷新率</td><td>两档可选：60 帧 / 最高帧率，实测可跑满（vsync 8.33 ms）</td></tr>
</table>

<h2>它不做什么</h2>
<ul>
  <li>不收集数据：只有你主动连网盘时才有网络请求</li>
  <li>没有账号、没有书架同步、没有阅读商城</li>
  <li>不支持 rar / 7z、DOCX，遇到会提示先转成 zip；PDF 与加密压缩包（ZipCrypto）已支持，密码 PDF 暂不支持</li>
</ul>

<div class="note"><b>一句话</b>
漫画在哪它就去哪读：本地包按需解压，网盘包按需下载，都不整包搬运。</div>
`);

A('从这里开始','install','安装与首次启动',
`
<p>安装包发布在 <a href="https://github.com/BaiFeng940/inkscroll/releases">GitHub Releases</a>，国内也可以用 <a href="https://gitcode.com/BaiFeng940/inkscroll">GitCode 镜像</a>。</p>

<h2>选哪个安装包</h2>
<table>
  <tr><th>文件名后缀</th><th>适用</th></tr>
  <tr><td><code>arm64-v8a</code></td><td><b>2016 年后绝大多数手机，选这个</b></td></tr>
  <tr><td><code>armeabi-v7a</code></td><td>较老的 32 位设备</td></tr>
  <tr><td><code>x86_64</code></td><td>模拟器、部分 Chromebook</td></tr>
  <tr><td><code>universal</code></td><td>不确定架构时用，体积约三倍</td></tr>
</table>

<p>不确定架构，可以在手机「设置 → 关于手机 → 处理器」里看；直接下 <code>universal</code> 也一定能装。</p>

<h2>首次启动</h2>
<ol>
  <li>打开后是两个标签：<b>本地库</b>与<b>在线库</b></li>
  <li>本地库右下角是「导入」按钮</li>
  <li>右上角齿轮进设置：网盘连接、翻页方式、缓存都在这里</li>
</ol>

<div class="warn"><b>升级提醒</b>
从 0.5.0 以前的版本升级如果提示「签名不一致」，需要先卸载旧版再装。卸载会清空书架和已添加的网盘连接，重新添加一次即可。</div>
`);

A('从这里开始','ui','界面导览',
`
<h2>首页</h2>
<ul>
  <li><b>搜索框</b>：在当前标签内按书名搜索</li>
  <li><b>齿轮</b>：进设置</li>
  <li><b>本地库</b>：从手机导入的漫画</li>
  <li><b>在线库</b>：从网盘或 NAS 添加的漫画</li>
  <li><b>导入按钮</b>：只在本地库显示</li>
</ul>

<h2>书架卡片</h2>
<p>封面取每本书的第一张图片。点开就是阅读；<b>长按进入批量管理</b>：勾选、全选、批量收藏、批量删除。卡片上不再有单独的三点菜单。</p>

<h2>阅读界面</h2>
<ul>
  <li>点屏幕<b>中间</b>：呼出或收起菜单</li>
  <li>点屏幕<b>左右两侧</b>：上一页 / 下一页</li>
  <li>拖底部进度条：边拖边看，松手落到那一页</li>
  <li>双击中间：缩放</li>
</ul>
`);

A('图文教程','walkthrough','从零开始：把网盘漫画导入并开始阅读',
`
<p>这一篇把整个流程串一遍，第一次用建议按顺序走完。</p>

<h2>① 准备好 WebDAV 信息</h2>
<p>去网盘或 NAS 的设置里开启 WebDAV，记下三样东西：<b>服务器地址、账号、WebDAV 密码</b>。</p>
<div class="warn"><b>注意</b>
多数网盘的 WebDAV 密码要<b>单独生成</b>，不是登录密码。</div>

<h2>② 设置 → 添加 WebDAV 库</h2>
<p>首页右上角齿轮进设置，在「在线库」里点「添加 WebDAV 库」，填上面三样。</p>

<figure>
  <img src="../img/settings.png" alt="inkScroll 的设置页：外观、阅读、通过压缩包导入、存储、在线库、关于" loading="lazy">
  <figcaption>设置页：阅读、屏幕刷新率、通过压缩包导入、存储、在线库、关于</figcaption>
</figure>

<h2>③ 浏览网盘，选到漫画根目录</h2>
<p>连上后会列出网盘内容。点进放漫画的那一层，底部会提示「会扫描这里的 N 个子文件夹」，再点右下角「添加为库」。</p>

<h2>④ 等它导完</h2>
<p>进度条显示「正在导入 12/120：第12话.zip」。几十本到一百多本通常要几分钟：每本都要联网读一次目录。</p>
<div class="warn"><b>导入期间别切走</b>
切到后台或息屏会中断这一批。已导入的书会保留，重新点「添加为库」会跳过已导入的，继续导剩下的。</div>

<h2>⑤ 回首页，切到「在线库」</h2>
<p>刚才导入的书都在这里，封面取每本书的第一张图片。</p>

<h2>⑥ 点开阅读</h2>

<figure>
  <img src="../assets/shot-menu.png" alt="inkScroll 阅读界面：顶部标题与页码，底部进度条和三种翻页模式" loading="lazy">
  <figcaption>阅读界面：页码、进度条，底部三个模式（左右滑动 / 左右点击 / 上下滑动）</figcaption>
</figure>

<h2>⑦ 常用操作</h2>
<table>
  <tr><th>想做什么</th><th>怎么做</th></tr>
  <tr><td>翻页</td><td>点屏幕左右两侧，或拖动</td></tr>
  <tr><td>呼出菜单</td><td>点屏幕中间</td></tr>
  <tr><td>快速翻很多页</td><td>拖底部进度条，拖动时内容实时跟随</td></tr>
  <tr><td>批量管理</td><td>长按任意一本书进入选择模式：全选、批量收藏、批量删除</td></tr>
  <tr><td>改默认翻页方式</td><td>设置 → 阅读 → 默认翻页方式</td></tr>
  <tr><td>看缓存占了多少</td><td>设置 → 存储 → 清理缓存</td></tr>
</table>
`);

A('本地导入','zip','导入压缩包',
`
<p>最常用的导入方式：首页右下角「导入」→ 选压缩包。</p>

<h2>支持的格式</h2>
<table>
  <tr><th>类型</th><th>支持</th></tr>
  <tr><td>压缩包</td><td><code>.zip</code> / <code>.cbz</code> / <code>.tar</code></td></tr>
  <tr><td>包内图片</td><td>JPG / PNG / GIF / WebP / BMP / AVIF</td></tr>
  <tr><td>不支持</td><td>rar、7z、tar.gz（先转成 zip）</td></tr>
</table>

<div class="note"><b>不会解压整个包</b>
导入时只读压缩包的<b>中央目录</b>（几百字节），翻到哪一页才解压那一页并缓存。几 GB 的包也秒开，不会瞬间占满手机空间。</div>

<h2>加密压缩包</h2>
<p>支持带密码的 zip。导入时提示输入密码，密码只在本机使用，不联网。</p>
`);

A('本地导入','folder','导入文件夹',
`
<p>「导入」→ 选文件夹。</p>

<p>用的是 Android 的 SAF 选择器，<b>不需要存储权限</b>：系统把选中目录的读取权限直接授给应用。</p>

<h2>注意</h2>
<ul>
  <li>导入的是<b>目录内所有图片</b>，含子目录</li>
  <li>图片按文件名<b>自然序</b>排（<code>1, 2, 10</code>，不是 <code>1, 10, 2</code>）</li>
  <li>顺序不对，可以在书架菜单里手动调整</li>
</ul>

<div class="warn"><b>不要选太上层的一级目录</b>
选中「内部存储」根目录会扫到大量无关图片。选到「漫画」这一层就够。</div>
`);

A('本地导入','loose','导入散图',
`
<p>「导入」→ 选图片，可以多选。</p>
<p>适合临时看几张图，或者图片在相册里而不是文件夹里。</p>

<div class="warn"><b>会复制一份</b>
inkScroll 把选中的图片<b>复制</b>到应用私有目录，所以删掉原图也能继续看。这些副本不会出现在系统相册里。</div>
`);

A('本地导入','order','调整页面顺序',
`
<p>自动排序不符合预期时，可以在书架里手动调整。</p>
<ol>
  <li>书架卡片菜单 → <b>调整页面顺序</b></li>
  <li>拖动或上下移动条目</li>
  <li>保存</li>
</ol>

<h2>自动排序规则</h2>
<p>用<b>自然序</b>，把连续数字当成一个整体比较：</p>
<pre><code>1.jpg, 2.jpg, 10.jpg        → 1, 2, 10  ✅
第1话, 第2话, 第10话          → 1, 2, 10  ✅</code></pre>
<p>数字位置很乱时（如 <code>a2b10</code>），自动排序可能不理想，手动调整即可。</p>
`);

A('网盘 / WebDAV','add','添加 WebDAV 库',
`
<p>网盘上的漫画不下载到手机，直接在线上看。</p>

<h2>前置条件</h2>
<table>
  <tr><th>需要</th><th>说明</th></tr>
  <tr><td>支持 WebDAV 的网盘</td><td>私有云：飞牛 / 群晖 / 威联通 / TrueNAS；商用：123云盘 / 坚果云 / Nextcloud / Alist</td></tr>
  <tr><td>WebDAV 地址</td><td>形如 <code>https://webdav.123pan.cn/webdav</code></td></tr>
  <tr><td>账号与密码</td><td>多数网盘要<b>单独生成</b> WebDAV 密码，不是登录密码</td></tr>
</table>

<h2>步骤</h2>
<ol>
  <li>设置 → 在线库 → <b>添加 WebDAV 库</b></li>
  <li>填服务器地址、账号、密码</li>

A('网盘 / WebDAV','collection','合集结构识别与合并合集',

<h2>规则</h2>
<table>

<pre><code>某某合集/第一话.zip   ┐
某某合集/第二话.zip   ├─→  一本书《某某》，章节：第一话 / 第二话 / 第三话
某某合集/第三话.zip   ┘</code></pre>
<p>「话」既可以是压缩包（<code>第一话.zip</code>），也可以是放图片的子目录（<code>第一话/</code>）。</p>

<table>

A('远程访问','judge','判断有没有公网 IP',
`
<p>在家连 NAS 只填局域网地址（如 <code>https://192.168.1.10:5006</code>）。出门后手机走移动网络，就访问不到内网地址了。</p>

<h2>先判断：你家宽带有没有公网 IP</h2>
<p>在能上网的电脑上搜「IP」，把查到的地址和<b>主路由器的 WAN 口地址</b>对比：</p>

<table>
  <tr><th>查到的地址</th><th>含义</th><th>能否直接外网访问</th></tr>
  <tr><td>和路由器 WAN 一致，形如 <code>120.x.x.x</code></td><td>有公网 IPv4</td><td>能，走端口映射</td></tr>
  <tr><td><code>100.64.x.x</code> ~ <code>100.127.x.x</code></td><td>运营商 <b>CGNAT</b> 大内网</td><td>不能，端口映射无效，只能隧道</td></tr>
  <tr><td><code>10.x</code> / <code>172.16~31.x</code> / <code>192.168.x</code></td><td>私有地址（可能光猫又做了一层 NAT）</td><td>不能，需先解决多层 NAT</td></tr>
</table>
`);

    <table>

A('远程访问','double-nat','双层 NAT 怎么办',
`
<p>如果光猫也做了拨号（路由器 WAN 口拿到的是 <code>192.168.x.x</code>），只在路由器上做映射不够：外面的包先到光猫就被丢了。</p>

<h2>三种解法</h2>
<table>
  <tr><th>方案</th><th>做法</th><th>评价</th></tr>
  <tr><td>光猫设 DMZ</td><td>DMZ 主机指向路由器 WAN IP</td><td>最省事</td></tr>
  <tr><td>两处都映射</td><td>光猫和路由器各加一条同样的规则</td><td>稍麻烦，但明确</td></tr>
  <tr><td>光猫改桥接</td><td>让路由器拨号，只剩一层 NAT</td><td>最干净，但可能影响 IPTV / 固话</td></tr>
</table>

<div class="warn"><b>DMZ 的风险</b>
DMZ 会把<b>所有</b>入站端口转给一台机器。只在路由器上做、只转必要端口更安全。</div>
`);

A('远程访问','tunnel','内网穿透隧道',
`
<p>适用于<b>没有公网 IP</b>（CGNAT、纯内网、多层 NAT）的情况。</p>

<p>思路反过来：让 <b>NAS 主动向外建立连接</b>，外面的设备连到中转服务器。常见工具：chmlfrp / SakuraFrp / frp / Cloudflare Tunnel。</p>

<h2>三个关键选项</h2>
<table>
  <tr><th>选项</th><th>怎么填</th><th>为什么</th></tr>
  <tr><td>端口类型</td><td><b>TCP</b></td><td>原始字节转发，NAS 的 TLS 端到端保留；选 HTTP/HTTPS 还会被要求备案域名</td></tr>
  <tr><td>本地端口</td><td><code>5006</code></td><td>填成网页端口 <code>5666</code> 会连到管理界面</td></tr>
  <tr><td>加密 / 压缩</td><td>都<b>关闭</b></td><td>流量本来就被 TLS 加密；图片已压缩，再压没有收益</td></tr>
</table>

<p>隧道建立后会给你一个地址，形如 <code>xxx.example.com:12345</code>。App 里填 <code>https://xxx.example.com:12345</code>，打开「允许自签名证书」即可。</p>

<div class="ok"><b>为什么推荐隧道</b>
它同时绕开：没有公网 IP、多层 NAT、运营商封端口、公网 IP 会变。代价是速度受中转服务器限制，流量经过第三方（内容仍是你的 TLS 加密）。</div>

<div class="warn"><b>安全提醒</b>
把 NAS 暴露到公网有风险，务必：① 建一个<b>只读</b>的 WebDAV 账号专门给阅读器；② 用非标准端口；③ 保持 HTTPS，不要退回 http。</div>
`);

A('存储与隐私','privacy','隐私说明',
`
<h2>不收集任何数据</h2>
<p>inkScroll 没有账号体系，不做行为统计，不上传任何内容。</p>

<h2>什么时候会联网</h2>
<ul>
  <li>只有你<b>主动连接网盘</b>时（WebDAV 请求）</li>
  <li>其余时间完全离线</li>
</ul>

<h2>漫画不会被系统相册看到</h2>
<p>导入的图片、解压产物、缓存全部存放在应用私有目录，并写入 <code>.nomedia</code> 标记，<b>不会出现在系统相册</b>里。</p>

<h2>密码怎么存的</h2>
<div class="warn"><b>是混淆，不是加密</b>
WebDAV 密码以 XOR + Base64 形式存在应用私有目录的 SharedPreferences 里。这只能防止被肉眼直接看到，<b>不能抵御有 root 权限的攻击者</b>。</div>
<p>所以反复建议：<b>给阅读器单独建一个只读账号</b>。即使密码泄露，对方也只能读到你指定的那个目录。</p>
`);

A('常见问题','conn-faq','连接类',
`
<h3>提示「用户名或密码不正确」</h3>
<p>网络是通的，只是认证没过。常见原因：</p>
<ul>
  <li>填的是<b>登录密码</b>，不是 WebDAV 单独生成的密码</li>
  <li>账号名填错（有的 NAS 用登录名，不是显示昵称）</li>
  <li>网盘禁止管理员账号走 WebDAV，换普通账号试试</li>
</ul>

<h3>连上了，但目录是空的</h3>
<p>这个账号<b>没有任何可见文件夹</b>。到网盘或 NAS 的权限设置里，给它分配一个目录的读取权限。</p>

<h3>提示「连接不上服务器」</h3>
<ul>
  <li>地址是否漏了 <code>https://</code> 或端口号</li>
  <li>手机和 NAS 是否在同一局域网</li>
  <li>HTTPS 用自签名证书 → 打开「允许自签名证书」</li>
</ul>

<h3>提示「这个地址看起来不是 WebDAV 服务」</h3>
<p>大概率填成了网页管理端口。飞牛网页是 5666，WebDAV 是 5005 / 5006。</p>
`);

A('常见问题','import-faq','导入类',
`
<h3>导入很慢，或者中途停了</h3>
<ul>
  <li>正常：每本都要联网读目录，几十本就要几分钟</li>
  <li>保持 App 在前台，别切走</li>
  <li>重新点「添加为库」会跳过已导入的，继续导剩下的</li>
</ul>

<h3>压缩包打不开，或者显示 0 页</h3>
<ul>
  <li>确认是 <code>.zip</code> / <code>.cbz</code> / <code>.tar</code></li>
  <li>加密压缩包需要输入密码</li>
  <li><code>.tar.gz</code> 不支持在线读取，先转成 zip</li>
</ul>

<h3>导入 0 本，提示「没有找到含图片的子文件夹」</h3>
<ul>
  <li>是不是选到了太上层（比如网盘根目录）</li>
  <li>如果是合集结构，确认<b>「识别合集结构」是开启的</b></li>
</ul>

<h3>重复导入会不会产生重复的书</h3>
<p>不会。按「连接 + 目录地址」判重，已在库里的直接跳过。</p>
`);

A('常见问题','read-faq','阅读类',
`
<h3>页面高度会跳一下</h3>
<p>某页还没解码过时，高度是按抽样估算的；解码后自动校正一次。翻过一次就不再跳。</p>

<h3>翻页能到，但位置对不准</h3>
<p>长条模式的总高度是动态计算的，拖进度条松手后会做两轮收敛修正。仍然偏的话再拖一次，或者直接上下滑到目标位置。</p>

<h3>字太小、太挤</h3>
<p>点屏幕中间呼出菜单 → 排版设置，可调字号、行距、边距。</p>

<h3>想跑满高刷新率，不知道在哪设置</h3>
<p>见「阅读 → 高刷新率」：先在 设置 → 外观 → 屏幕刷新率档位 选「最高帧率」，再在系统设置里把 inkScroll 加进白名单。</p>
`);

// ══════════════════════════════════════════════════════════════════════
// 渲染
// ══════════════════════════════════════════════════════════════════════
const navEl = document.getElementById('nav');
const mainEl = document.getElementById('main');
const menuBtn = document.getElementById('menuBtn');

(function buildNav(){
  let html = '';
  let lastGroup = null;
  for (const a of ARTICLES) {
    if (a.group !== lastGroup) {
      html += `<div class="grp">${a.group}</div>`;
      lastGroup = a.group;
    }
    html += `<a href="#/${a.id}" data-id="${a.id}">${a.title}</a>`;
  }
  navEl.innerHTML = html;
})();

function pager(art){
  const i = ARTICLES.indexOf(art);
  const prev = ARTICLES[i - 1], next = ARTICLES[i + 1];
  let html = '<div class="pager">';
  if (prev) html += `<a href="#/${prev.id}"><span>上一篇</span><b>${prev.title}</b></a>`;
  if (next) html += `<a href="#/${next.id}"><span>下一篇</span><b>${next.title}</b></a>`;
  return html + '</div>';
}

function render(){
  const m = location.hash.match(/^#\/(.+)$/);
  const id = m ? decodeURIComponent(m[1]) : ARTICLES[0].id;
  const art = ARTICLES.find(a => a.id === id) || ARTICLES[0];

  document.title = art.title + ' - inkScroll 帮助中心';
  mainEl.innerHTML = `
    <h1>${art.title}</h1>
    <p class="meta">${art.group}</p>
    ${art.html}
    ${pager(art)}
    <footer>
      inkScroll · 对应版本 0.14.1 ·
      <a href="../index.html">官网</a> ·
      <a href="https://github.com/BaiFeng940/inkscroll">GitHub</a> ·
      <a href="https://github.com/BaiFeng940/inkscroll/issues">反馈问题</a><br>
      图标征集中：512×512 的 PNG 投稿到
      <a href="mailto:jk968922@163.com">jk968922@163.com</a>，采用后会在应用关于页署名。
    </footer>`;

  navEl.querySelectorAll('a').forEach(a => {
    const on = a.dataset.id === art.id;
    a.classList.toggle('active', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });

  document.body.classList.remove('open');
  menuBtn.setAttribute('aria-expanded', 'false');
  scrollTo(0, 0);
}

addEventListener('hashchange', render);
render();

menuBtn.addEventListener('click', () => {
  const open = document.body.classList.toggle('open');
  menuBtn.setAttribute('aria-expanded', String(open));
});
navEl.addEventListener('click', e => {
  if (e.target.closest('a')) document.body.classList.remove('open');
});
addEventListener('keydown', e => {
  if (e.key === 'Escape') { document.body.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); }
});
</script>
</body>
</html>
