<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帮助中心 - inkScroll</title>
<style>
  :root{
    --bg:#fff; --side:#f7f8fa; --text:#1f2329; --muted:#646a73;
    --line:#e5e6eb; --accent:#3355dd; --accent-bg:#eef1ff;
    --code-bg:#f3f4f6; --warn-bg:#fff8e6; --warn-line:#f5c451;
    --ok-bg:#eefaf1; --ok-line:#4cc38a;
    --side-w:270px; --head-h:56px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171c; --side:#1b1e25; --text:#e6e8ee; --muted:#9aa3b2;
      --line:#2a2f39; --accent:#7c9cff; --accent-bg:#22283a;
      --code-bg:#20242d; --warn-bg:#2c2718; --warn-line:#8a6d1f;
      --ok-bg:#17281e; --ok-line:#2f7a52;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
  body{
    font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
         "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ── 顶栏 ── */
  header{
    position:fixed;top:0;left:0;right:0;height:var(--head-h);z-index:20;
    display:flex;align-items:center;gap:14px;padding:0 20px;
    background:var(--bg);border-bottom:1px solid var(--line);
  }
  header .logo{font-weight:700;font-size:16px;letter-spacing:-.2px}
  header .logo span{color:var(--accent)}
  header .hint{color:var(--muted);font-size:13px}
  header .right{margin-left:auto;display:flex;gap:16px;font-size:13px}
  #menuBtn{display:none;background:none;border:0;color:var(--text);font-size:20px;cursor:pointer}

  /* ── 左侧导航 ── */
  nav{
    position:fixed;top:var(--head-h);left:0;bottom:0;width:var(--side-w);
    overflow-y:auto;background:var(--side);border-right:1px solid var(--line);
    padding:16px 0 40px;
  }
  nav .grp{
    padding:14px 20px 6px;font-size:12px;font-weight:700;letter-spacing:.04em;
    color:var(--muted);text-transform:none;
  }
  nav a{
    display:block;padding:7px 20px 7px 24px;font-size:14px;color:var(--text);
    border-left:2px solid transparent;line-height:1.5;
  }
  nav a:hover{background:var(--accent-bg);text-decoration:none}
  nav a.active{
    color:var(--accent);background:var(--accent-bg);
    border-left-color:var(--accent);font-weight:600;
  }

  /* ── 正文 ── */
  main{
    margin-left:var(--side-w);padding:calc(var(--head-h) + 32px) 40px 100px;
    max-width:900px;
  }
  main h1{font-size:27px;line-height:1.4;margin:0 0 6px;letter-spacing:-.3px}
  main .meta{color:var(--muted);font-size:13px;margin-bottom:28px}
  main h2{font-size:19px;margin:34px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
  main h3{font-size:16px;margin:22px 0 8px}
  main p{margin:12px 0}
  main ul,main ol{padding-left:22px;margin:10px 0}
  main li{margin:6px 0}
  code{
    background:var(--code-bg);border-radius:4px;padding:1.5px 6px;font-size:13px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  pre{
    background:var(--code-bg);border-radius:8px;padding:14px 16px;overflow:auto;
    font-size:13px;line-height:1.6;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  pre code{background:none;padding:0}
  table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
  th,td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
  th{background:var(--side);font-weight:600}
  .box{
    border-radius:8px;padding:12px 16px;margin:16px 0;font-size:14px;
    border-left:3px solid var(--accent);background:var(--accent-bg);
  }
  .box.warn{border-left-color:var(--warn-line);background:var(--warn-bg)}
  .box.ok{border-left-color:var(--ok-line);background:var(--ok-bg)}
  .box b{display:block;margin-bottom:4px}
  figure{margin:18px 0;text-align:center}
  figure img{max-width:320px;width:100%;border-radius:10px;border:1px solid var(--line)}
  figcaption{color:var(--muted);font-size:12.5px;margin-top:8px}
  footer{
    margin-top:48px;padding-top:18px;border-top:1px solid var(--line);
    color:var(--muted);font-size:13px;
  }

  @media (max-width:900px){
    nav{transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.2)}
    body.open nav{transform:none}
    main{margin-left:0;padding-left:20px;padding-right:20px}
    #menuBtn{display:block}
    header .hint{display:none}
  }
</style>
</head>
<body>

<header>
  <button id="menuBtn" aria-label="菜单">☰</button>
  <div class="logo">ink<span>Scroll</span> 帮助中心</div>
  <div class="hint">本地与网盘漫画阅读器</div>
  <div class="right">
    <a href="../index.html">官网</a>
    <a href="../tutorial.html">图文教程</a>
    <a href="https://github.com/BaiFeng940/inkscroll">GitHub</a>
  </div>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<script>
// ══════════════════════════════════════════════════════════════════════
// 文章数据：group = 左侧分组，id = 路由片段
// ══════════════════════════════════════════════════════════════════════
const ARTICLES = [];

function A(group, id, title, html) { ARTICLES.push({group, id, title, html}); }

// ── 从这里开始 ─────────────────────────────────────────────────────────
A('从这里开始','intro','inkScroll 是什么',
`
<p>inkScroll 是一个 <b>本地与网盘漫画阅读器</b>，Android 优先、兼容 iOS。</p>

<h2>它能做什么</h2>
<table>
  <tr><th>能力</th><th>说明</th></tr>
  <tr><td>本地导入</td><td>压缩包（zip / cbz / tar）、文件夹、散图</td></tr>
  <tr><td>网盘在线看</td><td>通过 WebDAV 直连 NAS 或网盘，不用先下载</td></tr>
  <tr><td>压缩包在线读</td><td>网盘上的 zip 也能直接翻页，只下载当前那一页</td></tr>
  <tr><td>两种翻页</td><td>左右翻页 / 上下滑动（长条图）</td></tr>
  <tr><td>高刷新率</td><td>针对 120Hz 屏幕做了适配</td></tr>
</table>

<h2>它不做什么</h2>
<ul>
  <li><b>不收集任何数据</b>：只有你主动连接网盘时才会有网络请求</li>
  <li>不做在线阅读商城、不做社交、不需要注册账号</li>
  <li>不支持的格式：rar / 7z、PDF、DOCX（详见「支持的格式」）</li>
</ul>

<div class="box"><b>一句话</b>
你的漫画在哪，它就去哪读 —— 本地文件按需解压，网盘文件按需下载，两者都不整包搬运。</div>
`);

A('从这里开始','install','安装与首次启动',
`
<p>安装包发布在 GitHub Releases：</p>
<p><a href="https://github.com/BaiFeng940/inkscroll/releases">https://github.com/BaiFeng940/inkscroll/releases</a></p>

<h2>选哪个安装包</h2>
<table>
  <tr><th>文件名后缀</th><th>适用</th></tr>
  <tr><td><code>arm64-v8a</code></td><td><b>2016 年后绝大多数手机，选这个</b></td></tr>
  <tr><td><code>armeabi-v7a</code></td><td>较老的 32 位设备</td></tr>
  <tr><td><code>x86_64</code></td><td>模拟器、部分 Chromebook</td></tr>
  <tr><td><code>universal</code></td><td>不确定架构时用（体积约 3 倍）</td></tr>
</table>

<p>不确定自己是哪种，可以先在手机「设置 → 关于手机 → 处理器」里看，或者直接下 <code>universal</code>，一定能装。</p>

<h2>首次启动</h2>
<ol>
  <li>安装后打开，会看到两个标签：<b>本地库</b> 与 <b>在线库</b></li>
  <li>本地库右下角有「导入」按钮</li>
  <li>右上角齿轮进设置（网盘连接、翻页方式、缓存等都在这里）</li>
</ol>

<div class="box warn"><b>升级提醒</b>
如果从更早的版本升级提示「签名不一致」，需要先卸载旧版再安装。
卸载会清空书架与已添加的网盘连接，重新添加一次即可。</div>
`);

A('从这里开始','ui','界面导览',
`
<h2>首页</h2>
<ul>
  <li><b>搜索框</b>：在<b>当前标签</b>内搜索书名</li>
  <li><b>齿轮</b>：进入设置</li>
  <li><b>本地库</b>：从手机导入的漫画</li>
  <li><b>在线库</b>：从网盘 / NAS 添加的漫画</li>
  <li><b>导入按钮</b>：只在本地库显示</li>
</ul>

<h2>书架卡片</h2>
<p>每张卡片的封面取自<b>第一张图片</b>；点开就是阅读。</p>
<p>长按卡片（或点卡片上的菜单）可以：重命名、收藏、调整页面顺序、删除。</p>

<h2>阅读界面</h2>
<ul>
  <li>点屏幕<b>中间</b>：呼出 / 收起菜单</li>
  <li>点屏幕<b>左右两侧</b>：上一页 / 下一页</li>
  <li>底部进度条：拖动可实时预览并跳转</li>
  <li>双击中间：缩放</li>
</ul>
`);

// ── 图文教程 ───────────────────────────────────────────────────────────
A('图文教程','walkthrough','从零开始：把网盘漫画导入并开始阅读',
`
<p>这一篇把整个流程串起来，每一步都配了截图。第一次用建议按顺序看一遍。</p>

<h2>① 准备好网盘的 WebDAV 信息</h2>
<p>去网盘的设置里开启 WebDAV，记下三样东西：<b>服务器地址、账号、WebDAV 密码</b>。</p>
<div class="box warn"><b>注意</b>
多数网盘的 WebDAV 密码要<b>单独生成</b>，不是你的登录密码。</div>

<h2>② 打开设置 → 添加 WebDAV 库</h2>
<p>首页右上角齿轮进设置，在「在线库」里点「添加 WebDAV 库」，填上面三样东西。</p>

<figure>
  <img src="../img/settings.png" alt="设置页">
  <figcaption>设置页：阅读 / 屏幕刷新率 / 通过压缩包导入 / 存储 / 在线库 / 关于</figcaption>
</figure>

<h2>③ 浏览网盘，选中漫画根目录</h2>
<p>连接成功后会列出网盘里的内容。点进你的「漫画根目录」。</p>

<figure>
  <img src="../img/browse.png" alt="浏览网盘目录">
  <figcaption>点进漫画根目录后，底部会显示「会扫描这里的 N 个子文件夹」，再点右下角「添加为库」</figcaption>
</figure>

<h2>④ 等它导完</h2>
<p>进度条会显示「正在导入 12/120：第12话.zip」。几十本到一百多本通常要<b>几分钟</b>。</p>
<div class="box warn"><b>导入期间别切走</b>
中途退出会中断这一批导入；已导入的书会保留，重新点「添加为库」会跳过已导入的继续。</div>

<h2>⑤ 回到首页，切到「在线库」</h2>
<p>能看到刚才导入的书，封面取自每本书的第一张图片。</p>

<figure>
  <img src="../img/library-cloud.png" alt="在线库书墙">
  <figcaption>在线库：书挡来自网盘，封面自动取第一页</figcaption>
</figure>

<h2>⑥ 点开阅读</h2>

<figure>
  <img src="../img/reading.png" alt="阅读中">
  <figcaption>直接从网盘压缩包里读出的页面 —— 翻到哪页才下载哪页</figcaption>
</figure>

<h2>⑦ 常用操作</h2>
<table>
  <tr><th>想做什么</th><th>怎么做</th></tr>
  <tr><td>翻页</td><td>点屏幕左右两侧，或拖动</td></tr>
  <tr><td>呼出菜单</td><td>点屏幕中间</td></tr>
  <tr><td>快速翻很多页</td><td>拖动底部进度条（拖动时内容实时跟随）</td></tr>
  <tr><td>批量管理</td><td>长按任意一本书进入选择模式，可全选、批量收藏、批量删除</td></tr>
  <tr><td>改默认翻页方式</td><td>设置 → 阅读 → 默认翻页方式</td></tr>
  <tr><td>看缓存占了多少</td><td>设置 → 存储 → 清理缓存</td></tr>
</table>
`);
// ── 本地导入 ───────────────────────────────────────────────────────────
A('本地导入','zip','导入压缩包',
`
<p>这是最常用的导入方式。点首页右下角「导入」→ 选择压缩包。</p>

<h2>支持的格式</h2>
<table>
  <tr><th>类型</th><th>支持</th></tr>
  <tr><td>压缩包</td><td><code>.zip</code> / <code>.cbz</code> / <code>.tar</code></td></tr>
  <tr><td>包内图片</td><td>JPG / PNG / GIF / WebP / BMP / AVIF</td></tr>
  <tr><td>不支持</td><td>rar、7z、tar.gz（需先转成 zip）</td></tr>
</table>

<div class="box"><b>不会解压整个包</b>
导入时只读取压缩包的<b>中央目录</b>（几百字节），翻到哪一页才解压哪一页并缓存。
所以几 GB 的包也能秒开，也不会瞬间占满手机空间。</div>

<h2>加密压缩包</h2>
<p>支持带密码的 zip。导入时会提示输入密码，输入后只在本机使用、不联网。</p>
`);

A('本地导入','folder','导入文件夹',
`
<p>「导入」→ 选择文件夹。</p>

<p>因为采用了 Android 的 SAF 选择器，<b>不需要存储权限</b>，系统会直接把选中目录的读取权限授给应用。</p>

<h2>注意</h2>
<ul>
  <li>导入的是<b>目录内所有图片</b>（含子目录）</li>
  <li>图片按文件名<b>自然序</b>排列（<code>1, 2, 10</code> 而不是 <code>1, 10, 2</code>）</li>
  <li>顺序不对可以在书架菜单里手动调整</li>
</ul>

<div class="box warn"><b>不要选太大的一级目录</b>
如果选中「内部存储」根目录，会扫描到大量无关图片。建议选到「漫画」这一层。</div>
`);

A('本地导入','loose','导入散图',
`
<p>「导入」→ 选择图片，可以多选。</p>
<p>适合临时看几张图，或者图片存在相册里而不是文件夹中的情况。</p>

<div class="box warn"><b>隐私</b>
inkScroll 会把选中的图片<b>复制</b>到应用私有目录，所以删掉原图也能继续看。
这些副本不会出现在系统相册里。</div>
`);

A('本地导入','order','调整页面顺序',
`
<p>如果自动排序不符合预期，可以在书架里手动调整。</p>
<ol>
  <li>书架卡片菜单 → <b>调整页面顺序</b></li>
  <li>拖动或上下移动条目</li>
  <li>保存</li>
</ol>

<h2>自动排序规则</h2>
<p>采用<b>自然序</b>，即把连续数字当成一个整体比较：</p>
<pre><code>1.jpg, 2.jpg, 10.jpg        → 1, 2, 10  ✅
第1话, 第2话, 第10话          → 1, 2, 10  ✅</code></pre>
<p>如果文件名里数字位置很乱（如 <code>a2b10</code>），自动排序可能不理想，手动调整即可。</p>
`);

// ── 网盘 / WebDAV ──────────────────────────────────────────────────────
A('网盘 / WebDAV','add','添加 WebDAV 库',
`
<p>网盘漫画不下载到手机，直接在线上看。</p>

<h2>前置条件</h2>
<table>
  <tr><th>需要</th><th>说明</th></tr>
  <tr><td>支持 WebDAV 的网盘</td><td>私有云：飞牛 / 群晖 / 威联通 / TrueNAS；商用：123云盘 / 坚果云 / Nextcloud / Alist</td></tr>
  <tr><td>WebDAV 地址</td><td>形如 <code>https://webdav.123pan.cn/webdav</code></td></tr>
  <tr><td>账号与密码</td><td>多数网盘要<b>单独生成</b> WebDAV 密码，不是登录密码</td></tr>
</table>

<h2>步骤</h2>
<ol>
  <li>设置 → 在线库 → <b>添加 WebDAV 库</b></li>
  <li>填服务器地址、账号、密码</li>
  <li>若网盘用<b>自签名证书</b>（家用 NAS 常见），打开「允许自签名证书」</li>
  <li>点 <b>测试并连接</b></li>
</ol>

<div class="box"><b>地址怎么填</b>
含协议完整填 <code>https://webdav.123pan.cn/webdav</code> 最稳；
只填 <code>域名:端口</code> 也行，http/https 会自动识别。</div>

<div class="box warn"><b>百度网盘 / 阿里云盘</b>
这两家<b>本身不提供 WebDAV</b>，需要先用 <b>Alist</b> 等网关挂载并转成 WebDAV，
再把 Alist 的地址填进来。inkScroll 不限服务商，只要是标准 WebDAV 就能连。</div>
`);

A('网盘 / WebDAV','layout','整理漫画目录',
`
<p>导入时 <b>选中的目录 = 书架根目录</b>，它下面的每一个单位都会变成一本书。</p>

<h2>方式 A：一话一个文件夹</h2>
<pre><code>漫画根目录/
├── 第01话/  1.jpg  2.jpg  3.jpg …
├── 第02话/  1.jpg  2.jpg  3.jpg …
└── 第03话/  1.jpg  2.jpg  3.jpg …</code></pre>

<h2>方式 B：一话一个压缩包（推荐）</h2>
<pre><code>漫画根目录/
├── 第01话.zip
├── 第02话.zip
└── 第03话.zip</code></pre>

<h2>方式 C：合集嵌套（需要「识别合集结构」开启）</h2>
<pre><code>漫画根目录/
└── 某某合集/          ← 这一层只是分类，没有图片
    ├── 第一话/
    └── 第二话/</code></pre>

<div class="box warn"><b>不要选太上层</b>
选到网盘根目录会把几百个不相干的目录也扫进来，导入既慢又乱。选到「漫画」这一层就好。</div>
`);

A('网盘 / WebDAV','import','导入并等待',
`
<ol>
  <li>在目录列表里点进「漫画根目录」</li>
  <li>底部会显示「会扫描这里的 N 个子文件夹」</li>
  <li>点右下角 <b>添加为库</b></li>
  <li>等待扫描 + 导入完成</li>
</ol>

<h2>要等多久</h2>
<p>进度条显示「正在导入 12/120：第12话.zip」。几十本到一百多本通常需要<b>几分钟</b>。</p>

<table>
  <tr><th>阶段</th><th>在做什么</th></tr>

A('网盘 / WebDAV','collection','合集结构识别与合并合集',
`
<p><b>设置 → 在线库 → 识别「合集」结构（默认开启）</b></p>

<p>现实里的收藏常常多一层分类：</p>
<pre><code>漫画根目录/某某合集/第一话/</code></pre>
<p>这一层「某某合集」自己没有图片。如果只扫一层，整个合集会<b>被漏掉</b>（表现为导入 0 本）。</p>

<h2>规则</h2>
<table>
  <tr><th>子目录的情况</th><th>处理</th></tr>
  <tr><td>自己有图片或压缩包</td><td>直接成为一本书</td></tr>
  <tr><td>自己什么都没有，但下面有</td><td><b>再往下找一层</b>（每层最多展开 40 个）</td></tr>
</table>

<p>只多探<b>一层</b>是刻意的：更深的层级通常不是「一话」，继续递归既慢又容易把不相干目录也导进来。</p>

<h2>合并合集（0.14.0 新增，默认关闭）</h2>
<p><b>设置 → 在线库 → 合并合集</b></p>
<p>开启后，<b>一个合集 = 一本书</b>，合集里的每一话成为这本书的一个<b>章节</b>：</p>
<pre><code>某某合集/第一话.zip   ┐
某某合集/第二话.zip   ├─→  一本书《某某》，章节：第一话 / 第二话 / 第三话
某某合集/第三话.zip   ┘</code></pre>
<p>「话」既可以是压缩包（`第一话.zip`），也可以是放图片的子目录（`第一话/`）。</p>

<table>
  <tr><th></th><th>书架</th><th>打开后</th></tr>
  <tr><td><b>关闭</b>（默认）</td><td>每话一本，名字是「某某 第一话」</td><td>单话的内容</td></tr>
  <tr><td><b>开启</b></td><td>每合集一本，名字是「某某」</td><td>章节菜单切换各话，翻页可跨话连续</td></tr>
</table>

<div class="box warn"><b>开关只影响「重新导入」</b>
它决定导入时怎么建书，已经导入的书不会被改写。想对比两种效果：
改开关 → 删掉对应的书 → 再点「添加为库」。</div>

<div class="box ok"><b>建议</b>
合集里每话内容不多、又懒得在书架里翻几十本「第一话/第二话」时开启；
如果是各自独立的整本漫画，保持关闭。</div>

<div class="box"><b>什么时候该关掉识别结构</b>
如果你的目录结构非常规整（根目录下直接就是一话一话），关掉能少一次探测、扫描更快。
注意：<b>合并合集依赖「识别合集结构」</b>，后者关掉时不会合并。</div>
`);

A('远程访问','judge','判断有没有公网 IP',
`
<p>在家连 NAS 只要填局域网地址（如 <code>https://192.168.1.10:5006</code>）。
出门后手机连的是移动网络，就访问不到内网地址了。</p>

<h2>先判断：你家宽带有没有公网 IP</h2>
<p>在能上网的电脑上搜「IP」，把查到的地址和<b>主路由器的 WAN 口地址</b>对比：</p>

<table>
  <tr><th>查到的地址</th><th>含义</th><th>能否直接外网访问</th></tr>
  <tr><td>和路由器 WAN 一致，形如 <code>120.x.x.x</code></td><td>有公网 IPv4</td><td>✅ 走端口映射</td></tr>
  <tr><td><code>100.64.x.x</code> ~ <code>100.127.x.x</code></td><td>运营商 <b>CGNAT</b> 大内网</td><td>❌ 端口映射无效，只能隧道</td></tr>
  <tr><td><code>10.x</code> / <code>172.16~31.x</code> / <code>192.168.x</code></td><td>私有地址（可能光猫又做了一层 NAT）</td><td>❌ 需先解决多层 NAT</td></tr>
</table>
`);

    <table>

      <tr><td>内部 IP</td><td>NAS 的局域网地址，如 <code>192.168.1.10</code></td></tr>
      <tr><td>内部端口</td><td>WebDAV 端口，飞牛是 <code>5006</code></td></tr>

A('远程访问','double-nat','双层 NAT 怎么办',
`
<p>如果光猫也做了拨号（路由器 WAN 口拿到的是 <code>192.168.x.x</code>），
只在路由器上做映射不够 —— 外面的包先到光猫就被丢了。</p>

<h2>三种解法</h2>
<table>
  <tr><th>方案</th><th>做法</th><th>评价</th></tr>
  <tr><td>光猫设 DMZ</td><td>DMZ 主机指向路由器 WAN IP</td><td>最省事</td></tr>
  <tr><td>两处都映射</td><td>光猫和路由器各加一条同样的规则</td><td>稍麻烦，但明确</td></tr>
  <tr><td>光猫改桥接</td><td>让路由器拨号，只剩一层 NAT</td><td>最干净，但可能影响 IPTV / 固话</td></tr>
</table>

<div class="box warn"><b>DMZ 的风险</b>
DMZ 会把<b>所有</b>入站端口转给一台机器。只在路由器上做、且只转必要端口更安全。</div>
`);

A('远程访问','tunnel','内网穿透隧道',
`
<p>适用于<b>没有公网 IP</b>（CGNAT / 纯内网 / 多层 NAT）的情况。</p>

<p>思路反过来：让 <b>NAS 主动向外建立连接</b>，外面的设备连到中转服务器。
常见工具：chmlfrp / SakuraFrp / frp / Cloudflare Tunnel。</p>

<h2>三个关键选项</h2>
<table>
  <tr><th>选项</th><th>怎么填</th><th>为什么</th></tr>
  <tr><td>端口类型</td><td><b>TCP</b></td><td>原始字节转发，NAS 的 TLS 端到端保留；
      选 HTTP/HTTPS 还会被要求备案域名</td></tr>
  <tr><td>本地端口</td><td><code>5006</code></td><td>填成网页端口 <code>5666</code> 会连到管理界面</td></tr>
  <tr><td>加密 / 压缩</td><td>都<b>关闭</b></td><td>流量本来就被 TLS 加密；图片已压缩，再压无收益</td></tr>
</table>

<p>隧道建立后会给你一个地址，形如 <code>xxx.example.com:12345</code>。
App 里填 <code>https://xxx.example.com:12345</code>，打开「允许自签名证书」即可。</p>

<div class="box ok"><b>为什么推荐隧道</b>
它同时绕开：没有公网 IP、多层 NAT、运营商封端口、公网 IP 会变。
代价是速度受中转服务器限制，且流量经过第三方（但内容仍是你的 TLS 加密）。</div>

<div class="box warn"><b>安全提醒</b>
把 NAS 暴露到公网有风险，请务必：
① 建一个<b>只读</b>的 WebDAV 账号专门给阅读器；
② 用非标准端口；③ 保持 HTTPS，不要退回 http。</div>
`);

<p>inkScroll 没有账号体系，不做行为统计，不上传任何内容。</p>

<h2>密码怎么存的</h2>

<h3>压缩包打不开 / 显示 0 页</h3>

  <li>如果是「合集」结构，确认<b>「识别合集结构」是开启的</b></li>
</ul>

A('常见问题','read-faq','阅读类',
`
<h3>页面高度会跳一下</h3>
<p>某个页面还没解码过时，高度是按抽样估算的；解码后会自动校正一次。
翻过一次就不再跳。</p>

<h3>翻页能到，但位置对不准</h3>
<p>长条模式下总高度是动态计算的，拖动进度条松手后会做两轮收敛修正。
如果仍偏差，可以再拖一次，或直接上下滑动到目标位置。</p>

<h3>字太小 / 太挤</h3>
<p>点屏幕中间呼出菜单 → 排版设置，可调字号、行距、边距。</p>

<h3>想跑满 120Hz 但不知道在哪设置</h3>
<p>见「阅读 → 高刷新率」一节，需要你在系统设置里把本应用加进白名单。</p>
`);

// ══════════════════════════════════════════════════════════════════════
// 渲染
// ══════════════════════════════════════════════════════════════════════
const navEl = document.getElementById('nav');
const mainEl = document.getElementById('main');

(function buildNav(){
  let html = '';
  let lastGroup = null;
  for (const a of ARTICLES) {
    if (a.group !== lastGroup) {
      html += `<div class="grp">${a.group}</div>`;
      lastGroup = a.group;
    }
    html += `<a href="#/${a.id}" data-id="${a.id}">${a.title}</a>`;
  }
  navEl.innerHTML = html;
})();

function render(){
  const m = location.hash.match(/^#\/(.+)$/);
  const id = m ? m[1] : ARTICLES[0].id;
  const art = ARTICLES.find(a => a.id === id) || ARTICLES[0];

  mainEl.innerHTML = `
    <h1>${art.title}</h1>
    <div class="meta">${art.group}</div>
    ${art.html}
    <footer>
      inkScroll · <a href="../index.html">官网</a> ·
      <a href="https://github.com/BaiFeng940/inkscroll">GitHub</a> ·
      对应版本 0.7.0
      <div style="margin-top:14px;font-size:12px;opacity:.75">
        征集中：想为 inkScroll 画一个图标？
        投稿 <b>512×512</b> 的 PNG 到
        <a href="mailto:jk968922@163.com">jk968922@163.com</a>，
        采用后会在关于页署名。
      </div>
    </footer>`;

  navEl.querySelectorAll('a').forEach(a => {
    a.classList.toggle('active', a.dataset.id === art.id);
  });

  document.title = art.title + ' - inkScroll 帮助中心';
  document.body.classList.remove('open');
  window.scrollTo(0, 0);
}

addEventListener('hashchange', render);
render();

document.getElementById('menuBtn').addEventListener('click', () => {
  document.body.classList.toggle('open');
});
</script>
