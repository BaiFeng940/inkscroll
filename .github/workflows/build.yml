name: Build & Release

# 打 tag（例如 v0.1.0）时自动构建三个架构的 APK 并发布到 Releases。
# 也可以手动触发（Actions 页面 → Run workflow）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-pub

      - name: 单元测试
        run: flutter test --no-pub

      - name: 构建分架构 release APK
        run: flutter build apk --release --split-per-abi

      - name: 整理产物
        run: |
          mkdir -p out
          # 版本号从 pubspec.yaml 里读，**不要写死** ——
          # 之前写死了 0.2.0，发 0.3.0 时 APK 名字还是 0.2.0，很容易发错。
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "版本: $VER"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "out/inkscroll-${VER}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "out/inkscroll-${VER}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "out/inkscroll-${VER}-x86_64.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: inkscroll-apks
          path: out/*.apk

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          # ★ 只用自动生成的 release notes，**不要再写 body**。
          #   写了的话每次打 tag 都会把人工写好的详细发布说明覆盖掉
          #   （0.2.0 就踩到了：1310 字符的说明被覆盖成 343 字符）。
          #   需要详细说明时，打完 tag 后用 PATCH /releases/{id} 补。
          generate_release_notes: true
